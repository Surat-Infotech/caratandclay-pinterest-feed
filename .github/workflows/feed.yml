# Rebuilds the Carat & Clay Pinterest catalog feed every day from caratandclay.com.
# This repo stays private. Only the finished CSV is pushed to the public repo
# Surat-Infotech/caratandclay-pinterest-feed-public, which Pinterest reads daily at:
# https://raw.githubusercontent.com/Surat-Infotech/caratandclay-pinterest-feed-public/main/pinterest-feed.csv
#
# Needs the secret FEED_PUSH_TOKEN: a fine-grained token with Contents: Read and write
# on the public repo only.
name: Daily Pinterest feed

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily; Pinterest reads the feed later the same morning
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinterest-feed
  cancel-in-progress: false

env:
  PUBLIC_REPO: Surat-Infotech/caratandclay-pinterest-feed-public

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read products from caratandclay.com
        # Stops (and leaves yesterday's feed online) if fewer than 900 products could be read
        run: python scrape_products.py products.json 900
      - name: Build feed
        run: python build_feed.py products.json pinterest-feed.csv
      - name: Check out the public feed repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.FEED_PUSH_TOKEN }}
          path: public
      - name: Publish the CSV (only when it changed)
        run: |
          cp pinterest-feed.csv public/pinterest-feed.csv
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest-feed.csv
          if git diff --cached --quiet; then
            echo "Feed unchanged"
          else
            git commit -m "Daily feed $(date -u +%F): $(($(wc -l < pinterest-feed.csv) - 1)) items"
            git push
          fi
